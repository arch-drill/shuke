<style>
/* 版面：手機單欄；平板橫放＝左說明右畫板；桌機寬螢幕＝考場三欄 */
:root{--bg:#ffffff;--card:#ffffff;--ink:#1a1a1a;--mut:#6b6b6b;--line:#d4d4d4;--acc:#1a1a1a;--accbg:#efefef;--bad:#b3261e;--badbg:#fbe4e1;--ok:#256b3a;--okbg:#e0f1e4;--warn:#8a5a00;--warnbg:#fbefd2;--paper:#ffffff;color-scheme:light}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
.pad{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Microsoft JhengHei","PingFang TC",sans-serif}
header{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header h1{font-size:18px;margin:0;color:var(--acc)}
header .sp{flex:1}
button{font:inherit;padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:700}
button.big{font-size:18px;padding:10px 22px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input[type=number]{width:92px}
textarea{width:100%;min-height:64px}
main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1700px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 8px;color:var(--acc)}
.card h3{font-size:14px;margin:12px 0 4px;color:var(--mut)}
.mut{color:var(--mut)}.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:14px}
.exam{display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(330px,1fr) minmax(330px,1.1fr);gap:14px;align-items:start}
@media (max-width:1100px){.exam,.grid2{grid-template-columns:1fr}}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.q{text-align:left;padding:8px 10px}
.q b{color:var(--acc)}
.tag{display:inline-block;font-size:12px;padding:0 7px;border-radius:10px;background:var(--accbg);color:var(--acc);margin-right:4px}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}
.clock{font:700 64px/1 Consolas,monospace;text-align:center;letter-spacing:2px;margin:6px 0}
.clock.over{color:var(--bad)}
.sub{text-align:center;color:var(--mut)}
.ph{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;border:1px solid transparent}
.ph.cur{background:var(--accbg);border-color:var(--acc);font-weight:700}
.ph.done{color:var(--mut)}
.ph .n{flex:1}.ph .t{font-family:Consolas,monospace;font-size:13px}
.late{color:var(--bad)}.early{color:var(--ok)}
ul.tight{margin:4px 0;padding-left:20px}
label.chk{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}
label.chk input{margin-top:6px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:400;font-size:13px}
td.num{text-align:right;font-family:Consolas,monospace}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.out{background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px}
.out b{font-family:Consolas,monospace}
.flash{animation:fl 1s 3}
@keyframes fl{50%{background:var(--badbg)}}
.hide{display:none!important}
.narrow{max-width:600px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:8px}
.energy{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:10px}
.energy b{font-size:19px;color:var(--acc)}.energy span{color:var(--mut);font-size:14px}
.opt{text-align:left;padding:10px 14px}
button:disabled{opacity:.45;cursor:default}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin:10px 0}
.dots i{aspect-ratio:1;border-radius:4px;background:var(--line)}.dots i.on{background:var(--acc)}
.shot{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
a{color:var(--acc)}
.narrow.wide{max-width:980px}
.energy.on b,.energy.on span{color:var(--bg)}
.qv summary{cursor:pointer;color:var(--acc);padding:8px 0;font-weight:700}
.qv img{width:100%;display:block;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:#fff;cursor:zoom-in}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ovl .dl{max-width:520px;width:100%;margin:0}
.ovl.zoom{align-items:flex-start;background:rgba(0,0,0,.85);cursor:zoom-out}
.ovl.zoom img{width:min(1500px,180%);max-width:none;background:#fff;border-radius:6px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (pointer:coarse){button,input,select{min-height:44px}label.chk input{width:22px;height:22px;min-height:0;margin-top:2px}label.chk{padding:6px 0}}
@media (max-width:640px){header{gap:6px}header h1{font-size:15px}.clock{font-size:48px}}
/* ===== 畫板：平板是固定版面（不捲動），工具列在畫布左側，畫布吃滿剩下的空間 ===== */
.work{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.work>*{min-width:0}
.padwrap{display:flex;flex-direction:column;gap:8px;padding:8px;margin:0;min-height:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.padwrap button{touch-action:manipulation}
.pad{flex:1 1 auto;width:100%;min-width:0;min-height:0;height:58vh;height:58dvh;background:var(--paper);border:1px solid var(--line);border-radius:8px;touch-action:none;display:block;cursor:crosshair}
.padbar{display:flex;gap:5px;align-items:center;flex:none;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:2px}
.padbar button{flex:none;width:50px;height:44px;min-width:0;min-height:0;padding:0;font-size:13px;line-height:1.1}
.padbar hr{flex:none;width:1px;height:30px;border:0;background:var(--line);margin:0 2px}
.padbar .seg{display:flex;gap:3px;flex:none}
.padbar .seg button{width:34px}
.sz{display:inline-flex;align-items:center;justify-content:center}.sz i{display:block;width:20px;background:var(--ink);border-radius:3px}
.sz.on i{background:var(--bg)}
.sw{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px}
.sw i{width:18px;height:18px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.25)}
.sw.on{background:var(--card);color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);font-weight:700}
.padt{flex:none;font:700 17px/1 Consolas,monospace;text-align:center;min-width:50px}
.padt:empty{display:none}
.padwrap.full{position:fixed;inset:0;z-index:40;background:var(--card);border:0;border-radius:0;padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.padwrap.full .pad{height:auto}
@media (min-width:700px){
 body.drawing{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
 body.drawing header{flex:none;position:static}
 body.drawing main{flex:1 1 auto;min-height:0;width:100%;padding-block:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
 body.drawing .work{height:100%;grid-template-columns:minmax(250px,320px) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 body.drawing .work>div:first-child{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
 body.drawing .padwrap,.padwrap.full{flex-direction:row}
 body.drawing .pad,.padwrap.full .pad{height:auto;align-self:stretch}
 body.drawing .padbar,.padwrap.full .padbar{display:grid;grid-template-columns:50px 50px;align-content:start;justify-content:start;gap:5px;overflow-x:hidden;overflow-y:auto;padding:0 2px 0 0}
 body.drawing .padbar .wide,.padwrap.full .padbar .wide{grid-column:1/-1;width:auto}
 body.drawing .padbar hr,.padwrap.full .padbar hr{grid-column:1/-1;width:100%;height:1px;margin:1px 0}
 body.drawing .padbar .seg,.padwrap.full .padbar .seg{grid-column:1/-1}
 body.drawing .padbar .seg button,.padwrap.full .padbar .seg button{flex:1;width:auto}
}
/* 平板直放：題目在上、畫板在下吃滿寬度 */
@media (min-width:700px) and (orientation:portrait){
 body.drawing .work{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 body.drawing .work>div:first-child{max-height:32vh}
}
</style>

function calcOut(c){
 const A=+c.A,b=+c.b/100,f=+c.f/100,N=+c.N,p=Math.min(.8,Math.max(0,+c.p/100));
 const o={foot:A&&b?A*b:null,fa:A&&f?A*f:null};
 o.open=o.foot!=null?A-o.foot:null;
 o.gross=N?N/(1-p):null;
 o.use=o.gross&&o.fa?o.gross/o.fa:null;
 const g=o.gross||o.fa;
 o.fl=g&&o.foot?Math.ceil(g/o.foot-1e-9):null;
 o.per=o.fl?g/o.fl:null;
 o.park=(+c.c||0)*(+c.ca||0)+(+c.m||0)*(+c.ma||0);
 o.parkPct=o.park&&A?o.park/A:null;
 return o;
}

function streak(){let n=0,d=new Date(),rest={};if(!D.days[dstr(d)])d.setDate(d.getDate()-1);

function pick(e,avoid){const w=weights(),c=POOL[e].filter(s=>s!==avoid);const rec=Math.max(...c.map(s=>D.last[s]||0));

function genCalc(lv){
 const w=R(20,60,2),d=R(30,80,5),A=w*d,b=P([40,45,50,55,60]),f=P([120,160,200,225,240,300]);
 const T=[
  ()=>({q:`基地 ${w}m × ${d}m，建蔽率 ${b}%。最大建築面積是多少㎡？`,a:A*b/100,h:`${w}×${d}＝${A}；${A}×${b}%`}),
  ()=>({q:`基地 ${A}㎡，容積率 ${f}%。最大容積樓地板是多少㎡？`,a:A*f/100,h:`${A}×${f}%`}),
  ()=>{const s=P([200,300,400,500,600]),m=R(20,90,2);return{q:`比例 1/${s} 的圖上，實際 ${m}m 要畫幾公分？`,a:m*100/s,h:`${m}m＝${m*100}cm；÷${s}`}}];
 if(lv>=2)T.push(
  ()=>({q:`建蔽率 ${b}%、容積率 ${f}%，每層都蓋滿建蔽，至少要幾層才用完容積？`,a:Math.ceil(f/b-1e-9),h:`${f}÷${b}＝${(f/b).toFixed(2)}，無條件進位`}),
  ()=>{const p=P([80,90]);return{q:`基地 ${A}㎡、容積率 ${f}%，題目要求容積至少用到 ${p}%。樓地板下限是多少㎡？`,a:A*f/100*p/100,h:`${A}×${f}%×${p}%`}},
  ()=>{const n=P([20,30,60,120,200]),u=P([4,5,6.6,10]);return{q:`${n} 人、每人至少 ${u}㎡，這個空間至少多少㎡？`,a:n*u,h:`${n}×${u}`}});
 if(lv>=3)T.push(
  ()=>{const a1=R(30,45),a2=a1+R(6,24,2),h=R(40,60,5);return{q:`梯形基地：兩平行邊 ${a1}m、${a2}m，深 ${h}m，建蔽率 ${b}%。最大建築面積是多少㎡？`,a:(a1+a2)/2*h*b/100,h:`(${a1}+${a2})÷2×${h}＝${(a1+a2)/2*h}；×${b}%`}},
  ()=>{const s=P([3,3.5,4]);return{q:`基地 ${w}m × ${d}m，四周各退縮 ${s}m。可建範圍是多少㎡？`,a:(w-2*s)*(d-2*s),h:`(${w}−${2*s})×(${d}−${2*s})`}},
  ()=>{const A1=R(6,12)*100,A2=R(4,9)*100,f1=P([300,360,400]),f2=P([180,200,225]);return{q:`基地跨兩分區：商業區 ${A1}㎡（容積 ${f1}%）＋住宅區 ${A2}㎡（容積 ${f2}%）。總容積樓地板是多少㎡？`,a:A1*f1/100+A2*f2/100,h:`${A1}×${f1}%＋${A2}×${f2}%`}});
 const o=P(T)();o.a=Math.round(o.a*100)/100;return o}

 const pool=Q.filter(q=>D.reads[q.id]==null),q=P(pool.length?pool:Q),hard=q.hard.filter(x=>!x.startsWith('（建議'));
 shell('read',e,`<p><b>${q.y} 年｜${esc(q.t)}</b></p><p>讀原題，5 分鐘內寫下你覺得「絕對不能違反」的 3–5 條（紙上、心裡都可以）。然後對答案。</p>
  <div id="st"><button class="pri big" id="go">開始 5 分鐘</button></div>${qview(q,true)}`,false,true);
 $('#go').onclick=()=>{$('#st').innerHTML=`<div class="clock" id="cdn" style="font-size:40px"></div><button class="pri big" id="chk">寫好了，對答案</button>`;countdown(300,$('#cdn'));
  $('#chk').onclick=()=>{stopCd();const d=app.querySelector('.qv');if(d)d.open=false;$('#st').innerHTML=`<h3>這題的硬限制（有抓到的打勾）</h3>${hard.map(x=>`<label class="chk"><input type="checkbox" class="hc"><span>${esc(x)}</span></label>`).join('')}<div class="row" style="margin-top:12px"><button class="pri big" id="fin">完成</button></div>`;
   $('#fin').onclick=()=>{const c=app.querySelectorAll('.hc:checked').length;D.reads[q.id]=c/hard.length;saveD();finish('read',e,7,`${hard.length} 條抓到 ${c} 條。${c<hard.length?'漏掉的那幾條，就是考場上會被扣分的地方。':'全中。'}`)}}};
}
/* 10 分鐘：一張小圖（手繪少的人給 15 分鐘） */
function card(e){
 const todo=CARDS.map((c,i)=>i).filter(i=>D.cards[i]==null),weak=CARDS.map((c,i)=>i).filter(i=>D.cards[i]===0);
 const i=P(todo.length?todo:weak.length?weak:CARDS.map((c,k)=>k)),c=CARDS[i],q=findQ(c[0]),mins=D.prof&&D.prof.draw===0?15:10;
 shell('card',e,`<p><b>${c[0]} 年｜${esc(c[1])}</b></p><p class="mut small">${esc(q.site)}</p>
  <div class="out"><b>問題：</b>${esc(c[2])}<br><b>只畫這個：</b>${esc(c[3])}</div>
  <p class="mut small">${padOn()?'畫在旁邊的畫板，或 A4 一張。':'A4 一張、一支筆。'}不用漂亮，${mins} 分鐘到就停。</p>
  <div id="st"><button class="pri big" id="go">開始 ${mins} 分鐘</button></div>${qview(q)}`,true);
 $('#go').onclick=()=>{$('#st').innerHTML=`<div class="clock" id="cdn" style="font-size:40px"></div><button class="pri big" id="dn">畫好了</button>`;countdown(mins*60,$('#cdn'));
  $('#dn').onclick=()=>{stopCd();$('#st').innerHTML=`<div class="out"><b>合格的樣子：</b>${esc(c[5])}<br><b>如果情況變成這樣，你的圖還成立嗎？</b>${esc(c[4])}</div><h3>老實說，你的圖：</h3><div class="col"><button class="opt" data-s="0">沒畫出來／答非所問</button><button class="opt" data-s="1">有回答，但圖上看不太出來</button><button class="opt" data-s="2">圖上指得出來</button></div>`;
   app.querySelectorAll('#st .opt').forEach(b=>b.onclick=()=>{const s=+b.dataset.s;D.cards[i]=s;saveD();finish('card',e,mins,s===0?'這張之後會再出現一次。第二次通常就會了。':s===1?'差一步：下次先想「我要讓人在圖上看到什麼」再下筆。':'這張過了。想要有人幫你看圖，截圖或拍照丟給 Claude。')})}};
}

if(act)exam();else tonight();
